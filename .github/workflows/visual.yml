name: visual-and-axe

# Reusable job body (docs/dev/phase-2-testing.md 2.5): the "visual
# regression + axe" job needs to run on two different triggers — PRs
# labelled `visual` (ci.yml) and a nightly schedule (nightly.yml) — so it
# lives here once and both workflows call it via `uses:` rather than
# duplicating the job.

on:
  workflow_call:

jobs:
  visual:
    name: visual regression + axe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Visual regression + axe
        run: npm run test:visual
      # On failure: playwright-report/ has the HTML report (screenshot
      # diffs + traces, browsable via `npx playwright show-report`) and
      # test-results/axe/ has the full per-page axe violation payload the
      # failure message itself only summarizes one line per rule.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload test results (traces, axe JSON) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
