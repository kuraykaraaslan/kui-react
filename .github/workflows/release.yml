name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Validate tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm install --no-audit --no-fund
      - run: npm run build:lib
      - run: npm test -- --run
      - name: Create package artifact
        run: mkdir -p release && npm pack --pack-destination release
      - name: Create checksums
        run: sha256sum release/* > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## KUI React ${{ github.ref_name }}

            KUI React is the installable React/Next.js component library release.
            This release contains the compiled library output, TypeScript declarations,
            styles, and the npm package metadata required by consumers.

            ### Artifacts

            - npm package tarball generated from the package `files` allowlist
            - `SHA256SUMS` for integrity verification

            Install from npm with `npm install @kuraykaraaslan/kui-react`, or use
            the attached tarball for an offline/private registry workflow.

            This release does not contain an executable installer, Debian package,
            RPM package, or desktop application.
          files: release/*
      - name: Publish package
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm publish
          else
            echo "NPM_TOKEN is not configured; skipping npm publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
