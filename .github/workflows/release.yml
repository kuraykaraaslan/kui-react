name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Validate tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm install --no-audit --no-fund
      - run: npm run build:lib
      - run: npm test -- --run
      - name: Create package artifact
        run: mkdir -p release && npm pack --pack-destination release
      - name: Create checksums
        run: sha256sum release/* > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
      - name: Publish package
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm publish
          else
            echo "NPM_TOKEN is not configured; skipping npm publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
